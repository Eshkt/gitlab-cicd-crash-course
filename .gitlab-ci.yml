stages:
  - test
  - dockerize
  - deploy_test
  - inspect_ec2
  - deploy

image: python:3.9-slim-bookworm

variables:
  IMAGE_NAME: "eshkt/yaml-docker-hub"
  IMAGE_TAG: "first-container"
  APP_NAME: "yaml-docker-hub"

run_test:
  before_script:
    - apt-get update && apt-get install -y make
  stage: test
  script:
    - make test
build_image:
  stage: dockerize
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - echo "Buidling docker for $DOCKER_USER"
    - docker login -u "$DOCKER_USER" -p "$DOCKER_PASS"

  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
  script:
    - echo "Docker User is $DOCKER_USER"
    - echo "EC2 Host is $EC2_HOST"
  only:
    - main

test_deploy:
  stage: deploy_test
  script:
    - echo "Checking visibility..."
    - if [ -z "$SSH_PRIVATE_KEY" ]; then echo "KEY is MISSING"; else echo "KEY is FOUND"; fi
    - if [ -z "$EC2_HOST" ]; then echo "HOST is MISSING"; else echo "HOST is FOUND"; fi
    - echo "The value of HOST is [${EC2_HOST}]"


inspect_ec2: 
  stage: inspect_ec2
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client 
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
    - |
      ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
        echo "[1]---- Checking if config file exists ----"
        ls -l /etc/nginx/conf.d/default.conf || echo "default.conf MISSING"
        ls -l /etc/nginx/conf.d/python_app.conf || echo "python_app.conf MISSING"

        echo "[2]---- Printing the content of the config file ----"
        sudo cat /etc/nginx/conf.d/default.conf 2>/dev/null|| echo "Config file not found"

        echo "[3]---- Checking which config file is being used ----"
        sudo nginx -T | grep -A 15 "server {" || echo "No server block found in nginx configuration"

        echo "[4]---- Checking if nginx.conf is included in the conf.d----"
        grep "include /etc/nginx/conf.d" /etc/nginx/nginx.conf

        echo "[5] ---- checking for port 443 conflicts----"
        sudo netstat -tulpn | grep LISTEN

      EOF

deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  script:
    - |
      ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF

       #Install ssl
        sudo dnf install -y openssl nginx
        sudo systemctl start nginx
        sudo systemctl enable nginx

      #this is to install docker 
      if ! command -v docker &> /dev/null; then
          echo "Docker not found, now installing..."
          sudo dnf update -y
          sudo dnf install -y docker 
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $EC2_USER
          echo "Docker installed successfully."
        fi 

        #Create a directory and selfsigned certificate for HTTPS
        sudo mkdir -p /etc/nginx/ssl
        sudo chmod 700 /etc/nginx/ssl
        if [ ! -f /etc/nginx/ssl/server.crt ]; then
          sudo openssl req -x509 -noenc -days 365 -newkey rsa:2048 \
          -keyout /etc/nginx/ssl/server.key \
          -out /etc/nginx/ssl/server.crt \
          -subj "/C=US/ST=state/L=city/O=organization/CN=$EC2_HOST"
          fi

          #using sed and tee to create nginx config file and remove default config
          sudo sed -i 's/default_server//g' /etc/nginx/nginx.conf || true
          sudo rm -f /etc/nginx/conf.d/*.conf
  
        #create nginx config file
          APP_CONF="server {
              listen 80 default_server;
              listen 443 ssl default_server;
              server_name $EC2_HOST;
              ssl_certificate /etc/nginx/ssl/server.crt;
              ssl_certificate_key /etc/nginx/ssl/server.key;

              location / {
                  proxy_pass https://127.0.0:5000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }"
          echo "$APP_CONF" | sudo tee /etc/nginx/conf.d/default.conf > /dev/null

          sudo nginx -t && sudo systemctl restart nginx
          sudo systemctl enable nginx

        #2 Re-login to apply docker group permissions 
        sudo docker login -u $DOCKER_USER -p $DOCKER_PASS
        sudo docker pull $IMAGE_NAME:$IMAGE_TAG
        sudo docker stop $APP_NAME || true
        sudo docker rm $APP_NAME || true
        sudo docker run -d --name $APP_NAME -p 127.0.0.1:5000:5000 $IMAGE_NAME:$IMAGE_TAG
        
      EOF