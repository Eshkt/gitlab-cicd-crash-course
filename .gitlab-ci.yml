deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  before_script:
  # Installing dependencies and setting up SSH connection to EC2 instance
    - if [ -z "$EC2_HOST" ]; then echo "EC2_HOST is MISSING"; else echo "EC2_HOST is FOUND"; fi
    - echo "Scanning SSH host key for $EC2_HOST || Waiting for EC2 instance to be ready..."
    - apk add --no-cache openssh-client python3 py3-pip curl aws-cli
# printing public IP and ssetting up the dynamic Security Group rules for SSH access to EC2 instance
    - PUBLIC_IP=$(curl -s ifconfig.co/ip)
    - echo "Public IP is $PUBLIC_IP"
    - echo "Whitelisting the public IP $PUBLIC_IP for SSH access to EC2"
    #authorizing IP thru VPC ACLs
    - >
      aws ec2 authorize-security-group-ingress 
      --group-id "$SG_ID" 
      --protocol tcp --port 22 
      --cidr "${PUBLIC_IP}/32" 
      --region us-east-1 
    
    #SSH parameters and connection setup
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "Scanning for SSH host key for $EC2_HOST || Waiting for EC2 instance to be ready..."
    #this will print the allowed IPs for port 22, dictated by the VPC ACLs
    - aws ec2 describe-security-groups --group-ids $SG_ID --region us-east-1 --query "SecurityGroups[0].IpPermissions[?FromPort==\`22\`].IpRanges[].CidrIp" --output text
    - sleep 30 # Wait for EC2 instance to be ready (adjust as needed)
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
    - ssh ec2-user@$EC2_HOST "echo 'SSH connection successful!'"
  script:
    - |
      # Using 'EOF' with quotes to prevent GitLab from expanding $ variables locally
      #VARS="export IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' APP_NAME='$APP_NAME' DOCKER_USER='$DOCKER_USER' DOCKER_PASS='$DOCKER_PASS' EC2_HOST='$EC2_HOST'"

      echo  "# Using 'EOF' with quotes to prevent GitLab from expanding \$ variables locally"
      ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST \
        IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" APP_NAME="$APP_NAME" \
        DOCKER_PASS="$DOCKER_PASS" DOCKER_USER="$DOCKER_USER" EC2_HOST="$EC2_HOST" \
        'bash -s' << 'EOF'

       echo # 1. Install & Start Nginx/docker
        sudo dnf update -y
        sudo dnf install -y openssl nginx
        sudo systemctl start nginx
        sudo systemctl enable nginx

        if ! command -v docker &> /dev/null; then
          sudo dnf update -y
          sudo dnf install -y docker 
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $USER
        fi 

       echo "#Adding Canonical to ssl Certificate"
        sudo tee /etc/nginx/nginx.conf > /dev/null << 'CANONICAL'
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log notice;
      pid /var/run/nginx.pid;
      events { worker_connections 1024; }
      http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;
          sendfile on;
          keepalive_timeout 65;
          include /etc/nginx/conf.d/*.conf;
          }
      CANONICAL

        echo "# 2. Setup SSL Certificate"
        if [ ! -f /etc/nginx/ssl/server.crt ]; then
          sudo openssl req -x509 -noenc -days 365 -newkey rsa:2048 \
          -keyout /etc/nginx/ssl/server.key \
          -out /etc/nginx/ssl/server.crt \
          -subj "/C=US/ST=State/L=City/O=Organization/CN=$EC2_HOST"
        fi

        echo "# 3. Define the APP_CONF variable correctly"
        # Note: proxy_pass uses http, not https
        sudo rm -f etc/nginx/confg.d/*.conf
        sudo tee /etc/nginx/conf.d/python_app.conf > /dev/null << 'INNER'
        server {
            listen 80 default_server;
            listen 443 ssl default_server;
            server_name _;

            ssl_certificate /etc/nginx/ssl/server.crt;
            ssl_certificate_key /etc/nginx/ssl/server.key;

            location / {
                proxy_pass http://127.0.0.1:5000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
      INNER

        echo "# 4. Write the file and restart Nginx"
        sudo nginx -t && sudo systemctl restart nginx

        echo "# 5. Docker Deploy"
        sudo docker login -u "$DOCKER_USER" -p "$DOCKER_PASS"
        sudo docker pull "$IMAGE_NAME:$IMAGE_TAG"
        sudo docker stop "$APP_NAME" || true
        sudo docker rm "$APP_NAME" || true
        sudo docker run -d --name "$APP_NAME" -p 127.0.0.1:5000:5000 "$IMAGE_NAME:$IMAGE_TAG"
      EOF
  
inspect_ec2: 
  stage: inspect_ec2
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl aws-cli
  #ADDED BEFORE SCRIPT FOR ACL"
  # printing public IP and ssetting up the dynamic Security Group rules for SSH access to EC2 instance
    - PUBLIC_IP=$(curl -s ifconfig.co/ip)
    - echo "Public IP is $PUBLIC_IP"
    - echo "Whitelisting the public IP $PUBLIC_IP for SSH access to EC2"
    #authorizing IP thru VPC ACLs
    - >
      aws ec2 authorize-security-group-ingress 
      --group-id "$SG_ID" 
      --protocol tcp --port 22 
      --cidr "${PUBLIC_IP}/32" 
      --region us-east-1 

    - sleep 20 #give time to provision the acl rules
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
    - |
      ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
        echo "[1]---- Checking if config file exists ----"
        ls -l /etc/nginx/conf.d/default.conf || echo "default.conf MISSING"
        ls -l /etc/nginx/conf.d/python_app.conf || echo "python_app.conf MISSING"

        echo "[2]---- Printing the content of the config file ----"
        sudo cat /etc/nginx/conf.d/default.conf 2>/dev/null|| echo "Config file not found"

        echo "[3]---- Checking which config file is being used ----"
        sudo nginx -T | grep -A 15 "server {" || echo "No server block found in nginx configuration"

        echo "[4]---- Checking if nginx.conf is included in the conf.d----"
        grep "include /etc/nginx/conf.d" /etc/nginx/nginx.conf

        echo "[5] ---- checking for port 443 conflicts----"
        sudo netstat -tulpn | grep LISTEN

      EOF

aws_revoke:
  stage: aws_sg_revoke
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
    #revoking all the ACL rules for port 22 to ensure security after deployment
  before_script:
    - if [ -z $AWS_ACCESS_KEY_ID ]; then echo "AWS_ACCESS_KEY_ID is MISSING"; else echo "AWS_ACCESSKEY_ID is FOUND"; fi
    - if [ -z $AWS_SECRET_ACCESS_KEY ]; then echo "AWS secret key is missing"; else echo "AWS secret key is found"; fi
    - if [ -z $SG_ID ]; then echo "SG_ID is missing"; else echo "SG_ID is found"; fi  
    #authorizing the aws image IP for revoking the ACL rules.
    - PUBLIC_IP=$(curl -s ifconfig.co/ip)
    - echo "Public IP is $PUBLIC_IP"
    - echo "authorizing SSH access for runnner image IP"
    - >
      aws ec2 authorize-security-group-ingress
      --group-id "$SG_ID"
      --protocol tcp --port 22
      --cidr "${PUBLIC_IP}/32"
      --region us-east-1
      
  script:
    - export AWS_DEFAULT_REGION="us-east-1"
    - echo "Enumirating the current ACL rules for port 22" #enumerating ACL rules
    - IMG_IP=$(aws ec2 describe-security-groups --group-ids "$SG_ID" --query 'SecurityGroups[0].IpPermissions[?ToPort==`22`].IpRanges[].CidrIp' --output text)
    - 'echo "Raw output from AWS query for ACL rules on port 22 is: [${IMG_IP}]"'

    #Looping ACL revocation for existing IP
    - |
      if [ -z "$IMG_IP" ] || [ "$IMG_IP" = "None" ]; then
        echo "No IPs to revoke, ACL rules for port 22 is clean"
      else 
        for ip in $IMG_IP; do
          if [ "$ip" == "112.198.36.8/32" ]; then
            echo "Skipping revocation for Home/Office IP: $ip"
          else
            echo "Revoking SSH access for exsiting IP: $ip"
            aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$ip" \
            --region us-east-1
          fi
            done
        echo "Revocation process completed"
      fi 
  when: always 
  #to ensure that the revocation happens even if the previous steps fail, to maintain security

health_check:
  stage: verify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl openssh-client curl
  script:
  # starting health check for the EC2 Instance
    # attempting to curl EC2 instace 5 time with a 30 second delay...
    - |
      for i in {1..5}; do
        echo "Attempt $i':' Checking if EC2 instance is healthy..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$EC2_HOST:80)        
          if [ "$STATUS" = "200" ]; then
          echo "EC2 instance is healthy and responding to HTTP results"
          exit 0
        else
          echo "Failed $i Status($STATUS). Retrying in 10 seconds..."
          sleep 10 
        fi
      done
    - echo "EC2 Instance is not healthy, check and debug the instance manually"
    - exit 1

